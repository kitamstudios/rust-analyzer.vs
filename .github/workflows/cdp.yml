# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cdp

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  # No branches: key here — GitHub ignores it on workflow_dispatch. publish asserts the ref itself.
  workflow_dispatch:

env:
  VsixFileName: RustAnalyzer.vsix
  TestAdapterNameNoExt: KS.RustAnalyzer.TestAdapter
  BuildOutputArtifact: build-output
  T11HostArtifact: t11-main-host-inputs
  RUSTANALYZER_TELEMETRY_DISABLED: 1

jobs:
  # Host-independent test settings stay centralized here. The producer and two host jobs use literal
  # runner/major pairs because those pairs are part of the artifact and real-host contracts.
  config:
    name: config
    # Incidental: this job only checks out and reads one file.
    runs-on: windows-2022
    outputs:
      runner: ${{ steps.knobs.outputs.runner }}
      vs-major: ${{ steps.knobs.outputs.vs-major }}
      nightly-channel: ${{ steps.knobs.outputs.nightly-channel }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve gate configuration
        id: knobs
        shell: pwsh
        # The build and host-independent tests stay on VS 2022. The two host jobs below select and
        # validate their own exact Visual Studio installations.
        run: |
          . .\.github\scripts\Get-PinnedRustNightlyChannel.ps1
          "runner=windows-2022" >> $env:GITHUB_OUTPUT
          "vs-major=17" >> $env:GITHUB_OUTPUT
          "nightly-channel=$(Get-PinnedRustNightlyChannel)" >> $env:GITHUB_OUTPUT

  build-and-test:
    name: build-and-test
    needs: [config]
    runs-on: windows-2022
    outputs:
      version: ${{ steps.vsix_version.outputs.version-number }}

    steps:
      - uses: actions/checkout@v4

      - name: Stamp VSIX version
        id: vsix_version
        shell: pwsh
        run: |
          $version = .\.github\scripts\Set-VsixVersion.ps1 -BuildNumber $env:GITHUB_RUN_NUMBER
          "version-number=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: .\.github\scripts\Invoke-Build.ps1 -VisualStudioMajorVersion 17

      - name: Zip TestAdapter
        shell: pwsh
        run: .\.github\scripts\New-TestAdapterPackage.ps1 -OutputDirectory "${{ github.workspace }}\_built\projects\RustAnalyzer.TestAdapter" -DestinationPath "${{ github.workspace }}\_built\projects\RustAnalyzer.TestAdapter\${{ env.TestAdapterNameNoExt }}.zip"

      - name: Record canonical artifact hashes and lengths
        shell: pwsh
        run: .\.github\scripts\New-T11ArtifactManifest.ps1

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BuildOutputArtifact }}
          path: _built\projects
          if-no-files-found: error

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}.zip
          path: _built\projects\RustAnalyzer\${{ env.VsixFileName }}
          if-no-files-found: error

      - name: Upload TestAdapter
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TestAdapterNameNoExt }}.zip
          path: _built\projects\RustAnalyzer.TestAdapter\${{ env.TestAdapterNameNoExt }}.zip
          if-no-files-found: error

      - name: Upload T11 host inputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.T11HostArtifact }}
          path: |
            _built\projects\RustAnalyzer\${{ env.VsixFileName }}
            _built\projects\RustAnalyzer.TestAdapter\${{ env.TestAdapterNameNoExt }}.zip
            _built\t11\canonical-artifacts.json
          if-no-files-found: error

  unit:
    name: unit
    needs: [config, build-and-test]
    runs-on: ${{ needs.config.outputs.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BuildOutputArtifact }}
          path: _built\projects

      - name: Unit tests
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\.github\scripts\Invoke-Tests.ps1 -Mode unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: TestResults\*.xml
          if-no-files-found: ignore

  integration:
    name: integration
    needs: [config, build-and-test]
    runs-on: ${{ needs.config.outputs.runner }}
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.config.outputs.nightly-channel }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        shell: pwsh
        run: .\.github\scripts\Initialize-RustNightly.ps1

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BuildOutputArtifact }}
          path: _built\projects

      - name: Integration tests
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\.github\scripts\Invoke-Tests.ps1 -Mode integration -VisualStudioMajorVersion ${{ needs.config.outputs.vs-major }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: TestResults\*.xml
          if-no-files-found: ignore

  host-vs17:
    name: host-vs17
    needs: [config, build-and-test]
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.config.outputs.nightly-channel }}

    steps:
      - uses: actions/checkout@v4

      - name: Initialize host diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _diagnostics\host-vs17 -Force
          "Host validation has not started." | Set-Content -Path _diagnostics\host-vs17\bootstrap.txt

      - name: Install pinned Rust nightly
        shell: pwsh
        run: .\.github\scripts\Initialize-RustNightly.ps1

      - name: Download canonical host inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.T11HostArtifact }}
          path: _built

      - name: Validate Visual Studio 2022 host
        shell: pwsh
        run: .\.github\scripts\Invoke-T11HostValidation.ps1 -VisualStudioMajorVersion 17 -ArtifactRoot "${{ github.workspace }}\_built" -DiagnosticsDirectory "${{ github.workspace }}\_diagnostics\host-vs17" -RootSuffix "T11VS17${{ github.run_id }}${{ github.run_attempt }}"

      - name: Report evidence matrix
        if: always()
        shell: pwsh
        run: |
          $path = "_diagnostics\host-vs17\evidence-matrix.md"
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "The VS17 evidence matrix is missing."
          }
          Get-Content -LiteralPath $path | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload host diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t11-host-vs17-diagnostics
          path: _diagnostics\host-vs17
          if-no-files-found: error

  host-vs18:
    name: host-vs18
    needs: [config, build-and-test]
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.config.outputs.nightly-channel }}

    steps:
      - uses: actions/checkout@v4

      - name: Initialize host diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _diagnostics\host-vs18 -Force
          "Host validation has not started." | Set-Content -Path _diagnostics\host-vs18\bootstrap.txt

      - name: Install pinned Rust nightly
        shell: pwsh
        run: .\.github\scripts\Initialize-RustNightly.ps1

      - name: Download canonical host inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.T11HostArtifact }}
          path: _built

      - name: Validate Visual Studio 2026 host
        shell: pwsh
        run: .\.github\scripts\Invoke-T11HostValidation.ps1 -VisualStudioMajorVersion 18 -ArtifactRoot "${{ github.workspace }}\_built" -DiagnosticsDirectory "${{ github.workspace }}\_diagnostics\host-vs18" -RootSuffix "T11VS18${{ github.run_id }}${{ github.run_attempt }}"

      - name: Report evidence matrix
        if: always()
        shell: pwsh
        run: |
          $path = "_diagnostics\host-vs18\evidence-matrix.md"
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "The VS18 evidence matrix is missing."
          }
          Get-Content -LiteralPath $path | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload host diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t11-host-vs18-diagnostics
          path: _diagnostics\host-vs18
          if-no-files-found: error

  publish:
    name: publish
    # The ref, not just the event: workflow_dispatch can be started from any ref, and on.workflow_dispatch
    # has no branches: filter, so without this a feature branch could reach the Marketplace step.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
    needs: [config, build-and-test, unit, integration, host-vs17, host-vs18]
    runs-on: ${{ needs.config.outputs.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Download VSIX
        id: downloadvx
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}.zip
          path: _built\projects\RustAnalyzer

      - name: Download TestAdapter
        id: downloadta
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TestAdapterNameNoExt }}.zip
          path: _built\projects\RustAnalyzer.TestAdapter

      - name: Upload to Open VSIX
        uses: timheuer/openvsixpublish@v1
        with:
          vsix-file: '${{ steps.downloadvx.outputs.download-path }}\\${{ env.VsixFileName }}'

      - name: Tag and Release
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
        id: tag_release
        uses: softprops/action-gh-release@v0.1.15
        with:
          generate_release_notes: true
          tag_name: ${{ needs.build-and-test.outputs.version }}
          name: Release ${{ needs.build-and-test.outputs.version }}
          files: |
            '${{ steps.downloadvx.outputs.download-path }}\\${{ env.VsixFileName }}'
            '${{ steps.downloadta.outputs.download-path }}\\${{ env.TestAdapterNameNoExt }}.zip'

      - name: Publish extension to Marketplace
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
        uses: cezarypiatek/VsixPublisherAction@0.1
        with:
          extension-file: '${{ steps.downloadvx.outputs.download-path }}\\${{ env.VsixFileName }}'
          publish-manifest-file: 'vs-publish.json'
          personal-access-code: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}
