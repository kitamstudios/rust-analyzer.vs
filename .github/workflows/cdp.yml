# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cdp

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  # No branches: key here — GitHub ignores it on workflow_dispatch. publish asserts the ref itself.
  workflow_dispatch:

env:
  VsixFileName: RustAnalyzer.vsix
  TestAdapterNameNoExt: KS.RustAnalyzer.TestAdapter
  BuildOutputArtifact: build-output
  RUSTANALYZER_TELEMETRY_DISABLED: 1

jobs:
  # The single place the runner label, the Visual Studio major version and the pinned nightly channel
  # are decided. runs-on accepts needs.*.outputs but not env, so every other job reads its label here.
  config:
    name: config
    # Incidental: this job only checks out and reads one file. The gate's runner is the output below.
    runs-on: windows-2022
    outputs:
      runner: ${{ steps.knobs.outputs.runner }}
      vs-major: ${{ steps.knobs.outputs.vs-major }}
      nightly-channel: ${{ steps.knobs.outputs.nightly-channel }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve gate configuration
        id: knobs
        shell: pwsh
        # Verified against actions/runner-images on 2026-08-26: windows-2022 and windows-2025 both carry
        # VS Enterprise 2022 17.14.37614.0, so windows-2025 is not a VS 2026 image and moving to it would
        # change the host and nothing else. VS 2026 (major 18) exists only on windows-2025-vs2026, which
        # is public-repo only and belongs to S2. Every current Windows image preinstalls rustup, which is
        # what the nightly install steps below rely on.
        run: |
          . .\.github\scripts\Get-PinnedRustNightlyChannel.ps1
          "runner=windows-2022" >> $env:GITHUB_OUTPUT
          "vs-major=17" >> $env:GITHUB_OUTPUT
          "nightly-channel=$(Get-PinnedRustNightlyChannel)" >> $env:GITHUB_OUTPUT

  build-and-test:
    name: build-and-test
    needs: [config]
    runs-on: ${{ needs.config.outputs.runner }}
    outputs:
      version: ${{ steps.vsix_version.outputs.version-number }}

    steps:
      - uses: actions/checkout@v4

      - name: Stamp VSIX version
        id: vsix_version
        shell: pwsh
        run: |
          $version = .\.github\scripts\Set-VsixVersion.ps1 -BuildNumber $env:GITHUB_RUN_NUMBER
          "version-number=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: .\.github\scripts\Invoke-Build.ps1 -VisualStudioMajorVersion ${{ needs.config.outputs.vs-major }}

      - name: Zip TestAdapter
        shell: pwsh
        run: Compress-Archive -Path (& .\.github\scripts\Get-TestAdapterPackageFile.ps1 -OutputDirectory "${{ github.workspace }}\_built") -DestinationPath "${{ github.workspace }}\_built\${{ env.TestAdapterNameNoExt }}.zip" -Force

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BuildOutputArtifact }}
          path: _built
          if-no-files-found: error

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}.zip
          path: _built\${{ env.VsixFileName }}
          if-no-files-found: error

      - name: Upload TestAdapter
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TestAdapterNameNoExt }}.zip
          path: _built\${{ env.TestAdapterNameNoExt }}.zip
          if-no-files-found: error

  unit:
    name: unit
    needs: [config, build-and-test]
    runs-on: ${{ needs.config.outputs.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BuildOutputArtifact }}
          path: _built

      - name: Unit tests
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\.github\scripts\Invoke-Tests.ps1 -Mode unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: TestResults\*.xml
          if-no-files-found: ignore

  integration:
    name: integration
    needs: [config, build-and-test]
    runs-on: ${{ needs.config.outputs.runner }}
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.config.outputs.nightly-channel }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        shell: pwsh
        run: .\.github\scripts\Initialize-RustNightly.ps1

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BuildOutputArtifact }}
          path: _built

      - name: Integration tests
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\.github\scripts\Invoke-Tests.ps1 -Mode integration -VisualStudioMajorVersion ${{ needs.config.outputs.vs-major }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: TestResults\*.xml
          if-no-files-found: ignore

  # The only test of the shipped artefact: the harness sees an expanded copy of the published zip and
  # nothing else, so an assembly omitted from the package list fails here instead of reaching a customer.
  acceptance:
    name: acceptance
    needs: [config, build-and-test]
    runs-on: ${{ needs.config.outputs.runner }}
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.config.outputs.nightly-channel }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        shell: pwsh
        run: .\.github\scripts\Initialize-RustNightly.ps1

      - name: Download TestAdapter
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TestAdapterNameNoExt }}.zip
          path: .

      - name: Expand TestAdapter
        shell: pwsh
        run: Expand-Archive -LiteralPath .\${{ env.TestAdapterNameNoExt }}.zip -DestinationPath .\testadapter

      - name: Acceptance tests
        shell: pwsh
        run: .\src\TestProjects\run-integrationtests.ps1 -TestAdapterLocation .\testadapter -VisualStudioMajorVersion ${{ needs.config.outputs.vs-major }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-acceptance
          path: src\TestProjects\**\TestResults\*.trx
          if-no-files-found: ignore

  publish:
    name: publish
    # The ref, not just the event: workflow_dispatch can be started from any ref, and on.workflow_dispatch
    # has no branches: filter, so without this a feature branch could reach the Marketplace step.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
    needs: [config, build-and-test, unit, integration, acceptance]
    runs-on: ${{ needs.config.outputs.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Download VSIX
        id: downloadvx
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}.zip

      - name: Download TestAdapter
        id: downloadta
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TestAdapterNameNoExt }}.zip

      - name: Upload to Open VSIX
        uses: timheuer/openvsixpublish@v1
        with:
          vsix-file: '${{ steps.downloadvx.outputs.download-path }}\\${{ env.VsixFileName }}'

      - name: Tag and Release
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
        id: tag_release
        uses: softprops/action-gh-release@v0.1.15
        with:
          generate_release_notes: true
          tag_name: ${{ needs.build-and-test.outputs.version }}
          name: Release ${{ needs.build-and-test.outputs.version }}
          files: |
            '${{ steps.downloadvx.outputs.download-path }}\\${{ env.VsixFileName }}'
            '${{ steps.downloadta.outputs.download-path }}\\${{ env.TestAdapterNameNoExt }}.zip'

      - name: Publish extension to Marketplace
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
        uses: cezarypiatek/VsixPublisherAction@0.1
        with:
          extension-file: '${{ steps.downloadvx.outputs.download-path }}\\${{ env.VsixFileName }}'
          publish-manifest-file: 'vs-publish.json'
          personal-access-code: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}
